[package]
name = "dns-orchestrator-provider"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "DNS provider abstraction library for multiple cloud platforms (Cloudflare, Aliyun, DNSPod, Huaweicloud)"
authors = ["AptS-1547 <apts-1547@esaps.net>"]
repository = "https://github.com/AptS-1547/dns-orchestrator"
homepage = "https://github.com/AptS-1547/dns-orchestrator"
readme = "README.md"
keywords = ["dns", "cloudflare", "aliyun", "dnspod", "huaweicloud"]
categories = ["api-bindings", "web-programming"]
rust-version = "1.89"

[features]
default = ["rustls", "all-providers"]
# TLS 后端选择（二选一）
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
# 按需启用 providers
cloudflare = []
aliyun = []
dnspod = []
huaweicloud = []
all-providers = ["cloudflare", "aliyun", "dnspod", "huaweicloud"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["time"] }
futures.workspace = true
hmac = "0.12"
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
uuid.workspace = true
urlencoding.workspace = true
log.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
